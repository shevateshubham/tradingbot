name: Run Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [changes, "improvement/*"]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      TELEGRAM_BOT_TOKEN: test_token_placeholder
      TELEGRAM_CHAT_ID: "123456789"
      ANTHROPIC_API_KEY: test_key_placeholder
      TV_WEBHOOK_SECRET: test_secret
      ACCOUNT_SIZE: "100000"
      RISK_PER_TRADE_PERCENT: "1.0"
      MIN_CONFLUENCE_SCORE: "72"
      MAX_ACTIVE_TRADES: "3"
      MIN_RR_RATIO: "2.0"
      PAPER_MODE: "true"
      GITHUB_TOKEN: test_github_token
      GITHUB_USERNAME: testuser
      GITHUB_REPO: smc-trading-bot
      RAILWAY_API_TOKEN: test_railway_token
      RAILWAY_SERVICE_ID: test_service_id
      RAILWAY_PROJECT_ID: test_project_id

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --timeout=30

      - name: Post result to PR on failure
        if: failure()
        run: |
          echo "❌ Tests failed — merge to main is BLOCKED"
          echo "Fix failing tests before merging"
          exit 1

      - name: Confirm tests passed
        if: success()
        run: |
          echo "✅ All tests passed — merge is allowed"
